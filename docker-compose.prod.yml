services:
  caddy:
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - photo-viewer
      - auth
    restart: unless-stopped

  photo-viewer:
    build: .
    # No self-signed TLS here (unlike docker-compose.yml's dev service) -
    # Caddy terminates TLS at the edge and reaches this container over
    # the internal Docker network in plaintext, so uvicorn serves plain
    # HTTP. No host port published either; only Caddy is reachable from
    # outside this container network.
    #
    # --proxy-headers makes uvicorn trust Caddy's X-Forwarded-For (Caddy
    # sends it by default) so request.client.host reports the real
    # client IP, not Caddy's internal address - without this, every
    # request looks like it came from the same source. --forwarded-
    # allow-ips="*" is safe here specifically because this container
    # publishes no host port; the only path in is through Caddy or
    # another container already inside this compose network's trust
    # boundary. --no-server-header matches server/Dockerfile's existing
    # bar (avoid leaking the uvicorn version, TODO.md 0.2).
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8420", "--proxy-headers", "--forwarded-allow-ips=*", "--no-server-header"]
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env, never hardcode it}
      # Fixed boundary directory (app/main.py's PHOTOS_LIBRARY_ROOT) -
      # each subdirectory below is one admin-selectable photo source
      # (GET/PUT /api/settings/photos-source), not a separate mount
      # scheme per source. See documentation/plans/
      # tingly-humming-pudding.md.
      PHOTOS_LIBRARY_ROOT: /photo-library-root
    volumes:
      # Elisabeth's existing library - was mounted straight at /photos
      # before the admin source-setting existed; now one of two
      # selectable subdirectories under PHOTOS_LIBRARY_ROOT (default
      # active source is dpfas_media, not this one - switch back to
      # momfiles via the admin "Installningar" panel). Still read-only,
      # still never written to by this app.
      - ${PHOTOS_HOST_PATH:?set PHOTOS_HOST_PATH in .env to the real photo directory on this host, e.g. /tank/mammas_bilder}:/photo-library-root/momfiles:ro
      # New, separate, disposable directory - starts empty, populated by
      # any logged-in user via the app's own POST /api/upload (never by
      # browsing/copying server-side from elsewhere in /tank - uploads
      # come from the browser's own file picker, e.g. an sshfs-mounted
      # /tank on the uploader's own laptop). Default active photo source.
      # Read-write, unlike momfiles above - this is the one directory the
      # app itself ever writes into (app/main.py's UPLOAD_SOURCE_NAME).
      # Never the same path as momfiles; see tingly-humming-pudding.md's
      # "momfiles stays untouched" constraint.
      - /tank/dpfas_media:/photo-library-root/dpfas_media
      - thumbcache:/thumbcache
      - analytics_data:/data
      - stories:/stories
    # Raised 256m -> 512m 2026-07-17: this container kept getting
    # silently killed (no Python traceback, no dmesg OOM entry visible -
    # consistent with a cgroup hard-kill under container-limit memory
    # pressure) shortly after serving /thumb requests. Steady-state usage
    # is only ~40MB; the crash pattern points at transient spikes during
    # Pillow's decode+resize+encode, not steady growth. See
    # documentation/bugs/repo/under_process/2026-07-17-thumbnail-oom-under-load.md -
    # this is a mitigation, not a confirmed root-cause fix; re-verify
    # under real load before assuming it's fully solved.
    mem_limit: 512m
    restart: unless-stopped

  # Runs the detector models (quality trio + face detection/YuNet built so
  # far - documentation/curation/TODO.md's build plan) called by
  # photo-viewer over POST /detect. Deliberately standalone here: it takes
  # image bytes over HTTP, it doesn't read any mounted photo directory
  # itself - photo-viewer reads the active PHOTOS_LIBRARY_ROOT source
  # above and POSTs bytes to this service, so adding it never needed its
  # own mount. See documentation/plans/tingly-humming-pudding.md for the
  # admin photo-source setting this pairs with (app/benchmark_detector.py
  # drives this service directly, over /detect?include_timing=true, for
  # real per-detector CPU-time numbers on this hardware). No host port
  # published - reachable only from other containers on this compose
  # network, same as auth/postgres/redis.
  detector:
    build:
      context: .
      dockerfile: detector/Dockerfile
    mem_limit: 768m
    restart: unless-stopped

  auth:
    build: ./server
    # Overrides server/Dockerfile's baked-in CMD, which deliberately
    # omits --proxy-headers (safe default for direct/dev exposure with
    # no proxy in front - trusting X-Forwarded-For with no proxy would
    # let any caller spoof their own IP and dodge the login rate
    # limiter). Behind Caddy in this file specifically, the flag is
    # needed for the same reason as photo-viewer's override above -
    # without it, slowapi's per-IP login rate limit becomes one shared
    # bucket across every real client.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*", "--no-server-header"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: photo_server
      POSTGRES_USER: photo_server
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, never hardcode it}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env, never hardcode it}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env, never hardcode it}
      SMTP_HOST: smtp
      SMTP_PORT: "25"
      SMTP_FROM: "noreply@photos.reuterborg.se"
    depends_on:
      - postgres
      - redis
      - smtp
    mem_limit: 256m
    restart: unless-stopped

  # Self-hosted outbound-only relay for invite emails (app/mail.py) -
  # decided 2026-08-14 over a third-party email API specifically because
  # POLICY.md's closed-by-default rule forbids handing invitee email
  # addresses to a cloud API. No inbound receiving, no host port
  # published - auth is the only thing that ever talks to it, over the
  # internal compose network. DKIM_AUTOGENERATE creates this container's
  # own signing keypair on first start (persisted in smtp_dkim_keys so it
  # survives a restart/rebuild) - see DEPLOYMENT.md's SMTP section for the
  # one-time step to read the public half out and add it to DNS. Without
  # DKIM+SPF+DMARC all aligned, mail from a residential IP with no sending
  # history is likely to be spam-filtered or rejected outright by
  # Gmail/Outlook regardless of anything this container does correctly -
  # that risk is accepted for now (2026-08-14), verify actual delivery
  # once DNS is in place rather than assuming it works.
  smtp:
    image: boky/postfix@sha256:aafc772384232497bed875e1eb66b4d3e54ba1ebc86e2e185a6dc1dbc48182ef
    environment:
      ALLOWED_SENDER_DOMAINS: photos.reuterborg.se
      DKIM_AUTOGENERATE: "true"
    volumes:
      - smtp_dkim_keys:/etc/opendkim/keys
    mem_limit: 128m
    restart: unless-stopped

  redis:
    image: redis:8.8-alpine
    # --appendonly fsyncs every write (refresh-token SET/DEL) to
    # redis_data, so a restart (crash, host reboot, docker compose
    # down/up) doesn't wipe every logged-in user's session - see
    # documentation/bugs/repo/fixed/2026-07-18-redis-has-no-persistent-volume-every-restart-wipes-active-sessions-SOLVED.md
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env, never hardcode it}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    mem_limit: 128m
    restart: unless-stopped

  postgres:
    image: postgres:18.4-bookworm
    command: postgres -c max_connections=20 -c shared_buffers=128MB
    environment:
      POSTGRES_DB: photo_server
      POSTGRES_USER: photo_server
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, never hardcode it}
    volumes:
      - postgres_data:/var/lib/postgresql
    mem_limit: 512m
    restart: unless-stopped

volumes:
  thumbcache:
  analytics_data:
  stories:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  smtp_dkim_keys:
