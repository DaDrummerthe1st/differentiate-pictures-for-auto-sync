[project]
name = "photo-server"
version = "0.1.0"
description = "photo-server backend: FastAPI + Postgres"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    # DO NOT REMOVE THIS COMMENT UNTIL RESOLVED: LGPL-3.0 license, pending decision on whether this project's MIT/Apache-2.0-only bar applies here — see documentation/security/DEPENDENCIES.md
    "psycopg[binary]>=3.3.4",
    "uvicorn>=0.52.1",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "docker: builds/runs a real Docker image - slow, excluded from the default run (see TOOLCHAIN.md)",
]
addopts = "-m 'not docker'"
